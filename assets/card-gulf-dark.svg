<svg xmlns="http://www.w3.org/2000/svg" width="410" height="236" viewBox="0 0 410 236" role="img" aria-label="Guardian of the Gulf"><title>Guardian of the Gulf</title><style>@font-face{font-family:Kufi;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:Plex;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:PlexSB;src:url(data:font/woff2;base64,) format('woff2');}.wv0{animation:wv 3.2s linear infinite}.wv1{animation:wv 4.4s linear infinite}@keyframes wv{from{transform:translateX(0)}to{transform:translateX(32px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm-hide{display:none}.rm-show{display:inline}}.rm-show{display:none}</style><rect x=".75" y=".75" width="408.5" height="234.5" rx="14" fill="#0F1A2E" stroke="#26364F" stroke-width="1.5"/><clipPath id="wc"><rect x="322" y="22" width="64" height="40" rx="6"/></clipPath><g clip-path="url(#wc)"><path class="wv0" d="M258 38 q8 -7 16 0 t16 0 q8 -7 16 0 t16 0 q8 -7 16 0 t16 0 q8 -7 16 0 t16 0 q8 -7 16 0 t16 0 q8 -7 16 0 t16 0 q8 -7 16 0 t16 0 q8 -7 16 0 t16 0" fill="none" stroke="#7AA2FF" stroke-opacity="1" stroke-width="2" stroke-linecap="round"/><path class="wv1" d="M258 49 q8 -7 16 0 t16 0 q8 -7 16 0 t16 0 q8 -7 16 0 t16 0 q8 -7 16 0 t16 0 q8 -7 16 0 t16 0 q8 -7 16 0 t16 0 q8 -7 16 0 t16 0 q8 -7 16 0 t16 0" fill="none" stroke="#F06B9F" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round"/></g><text x="23.0" y="50.0" font-family="Kufi" font-size="22" fill="#E8EEF9" word-spacing="3.1">Guardian of the Gulf</text><text x="24.0" y="84.0" font-family="Plex" font-size="15" fill="#E8EEF9">Oriente les pêcheurs artisanaux du golfe de Gabès</text><text x="24.0" y="106.0" font-family="Plex" font-size="15" fill="#E8EEF9">vers une zone sûre et autorisée : satellite, météo,</text><text x="24.0" y="128.0" font-family="Plex" font-size="15" fill="#E8EEF9">bathymétrie hors ligne.</text><text x="24.0" y="174.0" font-family="Plex" font-size="13" fill="#94A3BF">React, TypeScript, Vercel</text><line x1="24" y1="190" x2="386" y2="190" stroke="#26364F"/><text x="24.0" y="217.0" font-family="Plex" font-size="13" fill="#94A3BF">Top 8, H12 Innovation 3.0</text><text x="386.0" y="217.0" font-family="PlexSB" font-size="13" fill="#7AA2FF" text-anchor="end">Ouvrir la démo</text></svg>