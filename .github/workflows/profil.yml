name: Profil

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mettre à jour le compte à rebours
        run: python3 scripts/update_countdown.py

      - name: Enregistrer le changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Compte à rebours mis à jour [skip ci]" && git push)

      - name: Générer le serpent des contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#C2255C&color_dots=#EBF0F7,#C9D8F0,#8FB0E6,#4C7FD6,#1B4FB8
            dist/snake-dark.svg?color_snake=#F06B9F&color_dots=#161B22,#1C3566,#2D57A8,#4F7FE0,#7AA2FF

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
